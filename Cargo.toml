[package]
name = "teep"
version = "0.1.2"
edition = "2024"
rust-version = "1.93"
description = "Your private telepath for the agent writing your code — a live terminal window into the codebase."
license = "MIT OR Apache-2.0"
homepage = "https://teep.app"
repository = "https://github.com/teep-app/teep"

[[bin]]
name = "teep"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs"] }
futures = "0.3"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1"
thiserror = "2"

# M2: file tree, fs-watch, syntax highlighting
notify = "8"
notify-debouncer-full = "0.7"
ignore = "0.4"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

# M3: fuzzy finder + command palette
nucleo-matcher = "0.3"

# M4: git integration
gix = "0.84"
similar = "3"

# M5: edit mode
# NOTE: upstream `tui-textarea` is unmaintained as of 2026; the ratatui org
# forked it to `ratatui-textarea`, which tracks ratatui 0.30+.
ratatui-textarea = "0.9"

# M6: markdown rendering (Level A)
# default-features disables comrak's built-in syntect highlighter (which pulls
# onig); we use our own syntect pipeline via src/syntax.rs.
comrak = { version = "0.52", default-features = false }
textwrap = "0.16"

# M8: mermaid diagrams via the external `mmdc` CLI; blake3 only used as
# a deterministic content-hash for the on-disk PNG cache.
blake3 = "1"

# M7: inline images via terminal graphics protocols (Kitty/iTerm2/Sixel/halfblock)
# default features include `chafa-dyn` which links libchafa (C dep) — skip it.
# Our supported fallback when no graphics protocol is available is the plain
# halfblock renderer built into ratatui-image.
ratatui-image = { version = "10", default-features = false, features = ["crossterm", "image-defaults"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
