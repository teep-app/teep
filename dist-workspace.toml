[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Homebrew tap receiving the formula bumps
tap = "teep-app/homebrew-teep"
# Publish jobs responsible for pushing the formula PR to the tap
publish-jobs = ["homebrew"]
# Releases live on the public dist repo, not on the private source repo.
# Requires GH_RELEASES_TOKEN in teep-app/source secrets (contents:write on
# teep-app/teep + teep-app/homebrew-teep).
github-releases-repo = "teep-app/teep"
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
]
